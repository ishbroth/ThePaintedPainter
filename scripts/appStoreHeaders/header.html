<!doctype html>
<!-- App Store header art for The Painted Painter. Rendered by render.mjs (headless Chrome) at both sizes: ?v=wide (3840x1646) and ?v=tall (5244x2950).
     Laid out on a 2000-px-wide canvas; the renderer scales it up. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0b1530; --orange: #ff7a2f; --gold: #f6c84a; --cream: #fff3c4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2000px; background: var(--navy); overflow: hidden; }
  body { font-family: 'Barlow', 'Segoe UI', sans-serif; color: #fff; }

  .frame { position: relative; width: 2000px; overflow: hidden; background: radial-gradient(120% 120% at 70% 40%, #12214a 0%, var(--navy) 60%, #070d20 100%); }
  .wide .frame { height: 857px; }
  .tall .frame { height: 1125px; }

  /* the picture: Superman with the lettering on his chest */
  .art { position: absolute; background: url('../../public/hero-superman.jpg') 0 0 / 100% 100% no-repeat; }
  .wide .art { left: 258px; top: 0; width: 1742px; height: 861px; }
  .tall .art { left: 477px; top: 185px; width: 1550px; height: 766px;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 14%, #000 100%), linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  /* the left of the picture fades into the navy so the text sits on a dark ground */
  .fade { position: absolute; inset: 0; background: linear-gradient(to right, rgba(11,21,48,.97) 0%, rgba(11,21,48,.93) 30%, rgba(11,21,48,.55) 46%, rgba(11,21,48,0) 60%); }
  .wide .fade { background: linear-gradient(to right, rgba(11,21,48,.98) 0%, rgba(11,21,48,.94) 32%, rgba(11,21,48,.6) 47%, rgba(11,21,48,0) 62%); }

  .border { position: absolute; border: 3px solid var(--orange); border-radius: 40px; box-shadow: 0 0 22px rgba(255,122,47,.55), inset 0 0 22px rgba(255,122,47,.35); }
  .wide .border { inset: 14px 14px 14px 14px; }
  .tall .border { inset: 20px; }

  /* the text column is designed at 900px wide and scaled for the taller picture */
  .col { position: absolute; left: 48px; width: 900px; transform-origin: 0 0; }
  .wide .col { top: 34px; }
  .tall .col { top: 112px; transform: scale(1.22); }

  .brand { display: flex; align-items: center; gap: 22px; }
  .icon { width: 88px; height: 88px; border-radius: 23px; background: url('../../ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png') center / cover; box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 0 22px 4px rgba(255,122,47,.7); }
  .brand b { font: 700 27px 'Barlow Condensed', sans-serif; letter-spacing: 8px; color: var(--orange); }

  .book { font: 400 70px/1 'Anton', Impact, sans-serif; letter-spacing: 1px; margin-top: 10px; white-space: nowrap; text-shadow: 0 4px 18px rgba(0,0,0,.55); }
  .app { font: 400 62px/1 'Anton', Impact, sans-serif; letter-spacing: 1px; margin-top: 10px; white-space: nowrap; color: var(--orange); text-shadow: 0 0 20px rgba(255,122,47,.55), 0 4px 16px rgba(0,0,0,.6); }

  .book, .app { margin-left: 76px; width: 360px; text-align: center; }

  /* ---------- the arrow and the words on the edge of the wheel, under "Book Your:" ---------- */
  .spin { position: relative; height: 460px; margin-top: 4px; display: flex; align-items: center; gap: 12px; }
  .arrow { position: relative; flex: none; width: 74px; height: 58px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  .arrow .gold { position: absolute; inset: 0; background: linear-gradient(#ffe38a, #d99a14); clip-path: polygon(0 22%, 52% 22%, 52% 0, 100% 50%, 52% 100%, 52% 78%, 0 78%); }
  .arrow .red { position: absolute; inset: 5px; background: linear-gradient(#ff4b3a, #b8100c); clip-path: polygon(0 22%, 52% 22%, 52% 0, 100% 50%, 52% 100%, 52% 78%, 0 78%); }
  .arrow .bulbs { position: absolute; inset: 0; clip-path: polygon(0 22%, 52% 22%, 52% 0, 100% 50%, 52% 100%, 52% 78%, 0 78%); background: radial-gradient(circle, #fff9d6 0 2.2px, transparent 3px) 0 0 / 14px 14px; opacity: .85; }

  /* just the words, no frame: the one in the middle is front and center, the rest shrink and fade away like the edge of a wheel */
  .drum { position: relative; flex: none; width: 340px; height: 460px; }
  .roll { position: absolute; left: 0; right: 0; top: 50%; height: 0; }
  .row { position: absolute; left: 0; right: 0; height: 72px; margin-top: -36px; display: flex; align-items: center; justify-content: center; white-space: nowrap;
    font: 400 46px/1 'Anton', Impact, sans-serif; letter-spacing: 3px; color: #f4f7ff; text-shadow: 0 2px 10px rgba(0,0,0,.65); }
  .row.hit { color: #fff; font-size: 84px; letter-spacing: 5px; text-shadow: 0 0 18px rgba(255,122,47,.95), 0 0 38px rgba(255,122,47,.55), 0 3px 10px rgba(0,0,0,.6); }

  /* the line under the wheel and the four steps: out from under the wheel, along the bottom of the picture */
  .bottom { position: absolute; transform-origin: 0 100%; padding: 18px 26px 20px; border-radius: 22px; background: rgba(8,14,34,.74); box-shadow: 0 0 30px rgba(0,0,0,.45); }
  .wide .bottom { left: 500px; bottom: 44px; }
  .tall .bottom { left: 640px; bottom: 150px; transform: scale(1.18); }
  .tag { font: 500 27px/1.28 'Barlow', sans-serif; color: #f2f5ff; white-space: nowrap; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .steps { display: flex; flex-wrap: nowrap; gap: 14px; margin-top: 14px; }
  .steps span { white-space: nowrap; font: 700 25px/1 'Barlow Condensed', sans-serif; letter-spacing: 4.5px; text-transform: uppercase; padding: 12px 24px; border: 2.5px solid var(--orange); border-radius: 12px; background: linear-gradient(rgba(70,30,30,.55), rgba(30,16,28,.7)); box-shadow: 0 0 14px rgba(255,122,47,.45); }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="art"></div>
  <div class="fade"></div>
  <div class="border"></div>
  <div class="col">
    <div class="brand"><div class="icon"></div><b>THE PAINTED PAINTER</b></div>
    <div class="book">Book Your:</div>
    <div class="spin">
      <div class="arrow"><div class="gold"></div><div class="red"></div><div class="bulbs"></div></div>
      <div class="drum"><div class="roll" id="roll"></div></div>
    </div>
    <div class="app">With an App!</div>
  </div>
  <div class="bottom">
    <div class="tag">The Marketplace Where Qualified Painters Compete for Your Job, at Your Price.</div>
    <div class="steps"><span>Describe the Job</span><span>Pick Your Price</span><span>Pick Your Painter</span><span>Book It</span></div>
  </div>
</div>
<script>
  const v = new URLSearchParams(location.search).get('v') === 'tall' ? 'tall' : 'wide';
  document.body.className = v;
  // PAINTER lands in the middle, as if the wheel had just been spun; the other words (in a shuffled, fixed order) trail off either side
  const words = ['CAR', 'HOTEL', 'DINNER', 'DOGSITTER', 'PAINTER', 'VACATION', 'BABYSITTER', 'TRAILER', 'POOL'];
  const STEP = 12, R = 255, GAP = 18; // a little extra room each side of the middle word // degrees between rows, and the drum radius
  const roll = document.getElementById('roll');
  words.forEach((w, i) => {
    const el = document.createElement('div');
    el.className = 'row' + (w === 'PAINTER' ? ' hit' : '');
    el.textContent = w;
    const a = (i - 4) * STEP;
    const r = a * Math.PI / 180; // a flat take on a drum: rows bunch up and flatten toward the top and bottom, as on a cylinder
    const c = Math.cos(r); // 1 at the middle row, falling toward the top and bottom
    el.style.transform = `translateY(${(Math.sign(a) * GAP + R * Math.sin(r)).toFixed(1)}px) scale(${(0.5 + 0.5 * c).toFixed(3)}, ${c.toFixed(3)})`;
    el.style.opacity = String((0.1 + 0.9 * Math.pow(c, 5)).toFixed(3));
    roll.appendChild(el);
  });
  document.fonts.ready.then(() => { document.title = 'ready'; });
</script>
</body>
</html>
